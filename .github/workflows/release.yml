name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        env:
          AUTODROID_RELEASE_STORE_BASE64: ${{ secrets.AUTODROID_RELEASE_STORE_BASE64 }}
        run: |
          echo "$AUTODROID_RELEASE_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/autodroid-release.jks"
      - run: ./gradlew ktlintCheck :engine:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon
        env:
          AUTODROID_RELEASE_STORE_FILE: ${{ runner.temp }}/autodroid-release.jks
          AUTODROID_RELEASE_STORE_PASSWORD: ${{ secrets.AUTODROID_RELEASE_STORE_PASSWORD }}
          AUTODROID_RELEASE_KEY_ALIAS: ${{ secrets.AUTODROID_RELEASE_KEY_ALIAS }}
          AUTODROID_RELEASE_KEY_PASSWORD: ${{ secrets.AUTODROID_RELEASE_KEY_PASSWORD }}
      - name: Rename APK
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/AutoDroid-${tag}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release/AutoDroid-${tag}-debug.apk"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "AutoDroid $GITHUB_REF_NAME" \
            release/*
