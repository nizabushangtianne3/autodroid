name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        env:
          AUTODROID_RELEASE_STORE_BASE64: ${{ secrets.AUTODROID_RELEASE_STORE_BASE64 }}
        run: |
          echo "$AUTODROID_RELEASE_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/autodroid-release.jks"
      - run: ./gradlew ktlintCheck :engine:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon
        env:
          AUTODROID_RELEASE_STORE_FILE: ${{ runner.temp }}/autodroid-release.jks
          AUTODROID_RELEASE_STORE_PASSWORD: ${{ secrets.AUTODROID_RELEASE_STORE_PASSWORD }}
          AUTODROID_RELEASE_KEY_ALIAS: ${{ secrets.AUTODROID_RELEASE_KEY_ALIAS }}
          AUTODROID_RELEASE_KEY_PASSWORD: ${{ secrets.AUTODROID_RELEASE_KEY_PASSWORD }}
      - name: Rename APK
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/AutoDroid-${tag}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release/AutoDroid-${tag}-debug.apk"
      - name: Generate release notes
        run: |
          previous_tag="$(git tag --sort=-creatordate --merged "$GITHUB_REF_NAME" | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)"
          {
            echo "AutoDroid $GITHUB_REF_NAME"
            echo
            if [ -n "$previous_tag" ]; then
              echo "## Changes"
              echo
              git log --reverse --no-decorate --format='- %s' "${previous_tag}..${GITHUB_REF_NAME}"
            else
              echo "Initial release."
            fi
          } > release-notes.md
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              release/*
          fi
