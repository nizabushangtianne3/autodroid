name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck :engine:test :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Rename APK
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/AutoDroid-${tag}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release/AutoDroid-${tag}-debug.apk"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "AutoDroid $GITHUB_REF_NAME" \
            release/*
